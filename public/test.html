<!DOCTYPE html>
<html>
<head>
    <title>Widget Test</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: sans-serif;
            padding: 40px;
            background-color: #f0f0f0;
        }
    </style>
</head>
<body>
    <h1>Testing the Live Chat Widget</h1>
    <p>This is a raw static HTML page to simulate an external client website.</p>
    <p>Look at the <strong>bottom right corner</strong> to see the widget button!</p>

    <!-- Embed the widget — fully configurable via data-* attributes -->
    <script
        src="/livechat.js"
        data-color="#ff0000"
        data-position="bottom-right"
        data-label="Chat with us 👋"
        data-button-size="60"
    ></script>
</body>
</html>
